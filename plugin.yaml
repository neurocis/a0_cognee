# This plugin is part of the neurocis method for personal assistant memory,
# used by the Bibiotek agent (librarian) for knowledge retention and semantic search.
name: a0_cognee
title: Cognee Knowledge Memory
description: >
  Integrates Cognee AI memory platform with Agent Zero.
  Automatically retains conversation knowledge as graph-connected memories,
  enriches recall with semantic and graph-based search, and injects
  knowledge context into the system prompt. Supports 14+ search strategies
  including graph completion, RAG, and chain-of-thought reasoning.
version: 1.6.0
settings_sections:
  - agent
per_project_config: true
per_agent_config: false
