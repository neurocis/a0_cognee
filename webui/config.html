<html>
<head>
    <title>Cognee Knowledge Memory Configuration</title>
</head>

<body>
    <div x-data>
        <template x-if="config">
            <div>
                <!-- ===== GLOBAL SETTINGS ===== -->
                <div class="section-title">Cognee Server Configuration</div>
                <div class="section-description">
                    Augments Agent Zero's memory with
                    <a href="https://www.cognee.ai/" target="_blank">Cognee</a>,
                    an open-source AI memory platform combining vector search with graph databases.
                    Retains, recalls, and contextualizes memories using 14+ search strategies.
                </div>

                <div class="section-description" style="margin-bottom: 1rem; padding: 0.5rem; background: var(--bg-secondary, #1a1a2e); border-radius: 6px; border-left: 3px solid var(--accent, #6c63ff);">
                    <strong>⚙️ Global Settings</strong> — These apply to all projects.
                    Switch to <strong>Default</strong> or any project to configure per-project settings below.
                </div>
                <div class="section-description" style="margin-bottom: 1rem; padding: 0.5rem; background: var(--bg-secondary, #1a1a2e); border-radius: 6px; border-left: 3px solid var(--accent, #ff9800);">
                    <strong>🔐 Credentials Note</strong> — <code>COGNEE_USERNAME</code> and <code>COGNEE_PASSWORD</code> must be set in <strong>Project Secrets</strong> AND configured in Cognee's <code>.env</code> file as <code>DEFAULT_USER_EMAIL</code> and <code>DEFAULT_USER_PASSWORD</code> for authentication to work.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Cognee Base URL</div>
                        <div class="field-description">
                            The URL where your Cognee server is running.
                            This setting is global — shared across all projects.
                            Example: <code>http://localhost:8000</code> or <code>http://192.168.1.100:8000</code>
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.cognee_base_url"
                               placeholder="http://localhost:8000" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Dataset Prefix</div>
                        <div class="field-description">
                            Prefix for Cognee dataset IDs.
                            Combined with project name for isolation.
                            This setting is global — shared across all projects.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.cognee_dataset_prefix"
                               placeholder="a0" />
                    </div>
                </div>

                <!-- ===== PER-PROJECT SETTINGS ===== -->
                <div style="margin-top: 1.5rem;"></div>

                <div class="section-description" style="margin-bottom: 1rem; padding: 0.5rem; background: var(--bg-secondary, #1a1a2e); border-radius: 6px; border-left: 3px solid var(--success, #4caf50);">
                    <strong>📁 Per-Project Settings</strong> — Use the project selector above to switch between
                    <strong>Default</strong> (fallback for all projects) and individual project overrides.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Explicit Dataset ID Override</div>
                        <div class="field-description">
                            Leave blank to auto-derive dataset ID from prefix + project name.
                            Set to a specific name (e.g., "Agent0") to use that dataset instead of derived format.
                            Per-project: each project can use a different dataset.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                               x-model="config.cognee_dataset_id"
                               placeholder="Leave blank for auto-derivation" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable Retain</div>
                        <div class="field-description">
                            Store conversation knowledge to Cognee after each interaction.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_retain_enabled" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable Recall</div>
                        <div class="field-description">
                            Enrich agent responses with Cognee semantic and graph-based search results.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_recall_enabled" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable Context Injection</div>
                        <div class="field-description">
                            Inject knowledge graph context into the system prompt.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_context_enabled" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto-Cognify</div>
                        <div class="field-description">
                            Automatically build knowledge graph after retaining new data.
                            Disable for manual control over when cognification runs.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_auto_cognify" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Search Type</div>
                        <div class="field-description">
                            Cognee search strategy for recall queries.
                            Graph Completion uses graph-aware Q&A; RAG uses standard vector retrieval.
                        </div>
                    </div>
                    <div class="field-control">
                        <select x-model="config.cognee_search_type">
                            <option value="GRAPH_COMPLETION">Graph Completion (default)</option>
                            <option value="RAG_COMPLETION">RAG Completion</option>
                            <option value="GRAPH_COMPLETION_COT">Graph Chain-of-Thought</option>
                            <option value="GRAPH_SUMMARY_COMPLETION">Graph Summary</option>
                            <option value="TRIPLET_COMPLETION">Triplet Completion</option>
                            <option value="CHUNKS">Chunks (raw)</option>
                            <option value="SUMMARIES">Summaries</option>
                            <option value="FEELING_LUCKY">Feeling Lucky (auto)</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Recall Max Tokens</div>
                        <div class="field-description">
                            Maximum tokens to inject from recall search results.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number"
                               x-model.number="config.cognee_recall_max_tokens"
                               placeholder="4096" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Context Max Tokens</div>
                        <div class="field-description">
                            Maximum tokens for knowledge context injected into the system prompt.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number"
                               x-model.number="config.cognee_context_max_tokens"
                               placeholder="500" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Context Cache TTL (seconds)</div>
                        <div class="field-description">
                            How long to cache search results before re-querying Cognee.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number"
                               x-model.number="config.cognee_cache_ttl"
                               placeholder="120" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Debug Logging</div>
                        <div class="field-description">
                            Enable verbose logging for troubleshooting Cognee integration.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_debug" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <!-- ─── Verbose Feedback Mode ─── -->
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Verbose Mode</div>
                        <div class="field-description">
                            Emit structured feedback events for init/recall/retain/context
                            operations, similar to FAISS memory sections. Disabled by default
                            to keep normal conversations clean.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_verbose" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field" x-show="config.cognee_verbose">
                    <div class="field-label">
                        <div class="field-title">Verbose: Include Dataset</div>
                        <div class="field-description">
                            Include the dataset name in verbose events.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_verbose_include_dataset" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field" x-show="config.cognee_verbose">
                    <div class="field-label">
                        <div class="field-title">Verbose: Include Recall Count</div>
                        <div class="field-description">
                            Include approximate recall result counts in verbose events.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_verbose_include_recall_count" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field" x-show="config.cognee_verbose">
                    <div class="field-label">
                        <div class="field-title">Verbose: Include Retain Status</div>
                        <div class="field-description">
                            Include retain item counts and success status in verbose events.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_verbose_include_retain_status" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field" x-show="config.cognee_verbose">
                    <div class="field-label">
                        <div class="field-title">Verbose: Include Prompt Injection Status</div>
                        <div class="field-description">
                            Include whether the verbose event was injected into the prompt.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_verbose_include_prompt_injection_status" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field" x-show="config.cognee_verbose">
                    <div class="field-label">
                        <div class="field-title">Verbose: Emit to Prompt</div>
                        <div class="field-description">
                            Append a `# Cognee Verbose` markdown block to the prompt when emitting.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_verbose_emit_to_prompt" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field" x-show="config.cognee_verbose">
                    <div class="field-label">
                        <div class="field-title">Verbose: Emit to Log</div>
                        <div class="field-description">
                            Write each verbose event to the A0 util log channel.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox"
                                   x-model="config.cognee_verbose_emit_to_log" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>


                <!-- Save Button -->
                <div class="settings-actions">
                    <button @click="saveConfig()" class="settings-save-btn">
                        💾 Save Configuration
                    </button>
                    <p id="save-message" class="settings-message" style="display: none;"></p>
                </div>
            </div>
        </template>
    </div>

    <script>
        function saveConfig() {
            const btn = document.querySelector('.settings-save-btn');
            const msg = document.getElementById('save-message');
            const originalText = btn.textContent;
            
            btn.disabled = true;
            btn.textContent = '⏳ Saving...';
            msg.style.display = 'none';
            
            // Send config to backend
            fetch(window.location.href, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Plugin-Config': 'a0_cognee'
                },
                body: JSON.stringify({
                    action: 'save_config',
                    config: Alpine.$data(document.querySelector('[x-data]')).config
                })
            })
            .then(resp => resp.json())
            .then(data => {
                if (data.success) {
                    msg.className = 'settings-message success';
                    msg.textContent = '✅ Configuration saved successfully';
                } else {
                    msg.className = 'settings-message error';
                    msg.textContent = `❌ Save failed: ${data.error || 'Unknown error'}`;
                }
                msg.style.display = 'block';
            })
            .catch(err => {
                msg.className = 'settings-message error';
                msg.textContent = `❌ Error: ${err.message}`;
                msg.style.display = 'block';
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = originalText;
            });
        }
    </script>

    <style>
        :root {
            --accent: #6c63ff;
            --success: #4caf50;
            --bg-secondary: #1a1a2e;
            --text-primary: #e0e0e0;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 2rem 0 0.5rem 0;
            color: var(--text-primary);
        }

        .section-description {
            font-size: 0.95rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .section-description a {
            color: var(--accent);
            text-decoration: none;
        }

        .section-description a:hover {
            text-decoration: underline;
        }

        .field {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            gap: 2rem;
        }

        .field:last-of-type {
            border-bottom: none;
        }

        .field-label {
            flex: 1;
            min-width: 0;
            padding-top: 0.25rem;
        }

        .field-title {
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .field-description {
            font-size: 0.85rem;
            color: #808080;
            line-height: 1.4;
        }

        .field-description code {
            background: var(--bg-secondary);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: var(--accent);
        }

        .field-control {
            flex: 1;
            min-width: 0;
        }

        .field-control input[type="text"],
        .field-control input[type="number"],
        .field-control select {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .field-control input[type="text"]:focus,
        .field-control input[type="number"]:focus,
        .field-control select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.2);
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            cursor: pointer;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggler {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: 0.3s;
            border-radius: 24px;
        }

        .toggler:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggler {
            background-color: var(--success);
        }

        input:checked + .toggler:before {
            transform: translateX(26px);
        }

        .settings-actions {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .settings-save-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
            font-weight: 500;
        }

        .settings-save-btn:hover {
            background: #45a049;
        }

        .settings-save-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .settings-message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }

        .settings-message.success {
            background: #1e4620;
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .settings-message.error {
            background: #4a1a1a;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        @media (max-width: 768px) {
            .field {
                flex-direction: column;
                align-items: flex-start;
            }

            .field-label {
                margin-right: 0;
                margin-bottom: 1rem;
            }

            .field-control {
                min-width: 100%;
            }
        }
    </style>
</body>
</html>
