# Cognee Knowledge Memory - Default Configuration
# These values are used when not overridden in the plugin settings UI.

# Cognee API base URL (e.g., http://localhost:8000)
cognee_base_url: "http://localhost:8000"

# Dataset name prefix - combined with project name for isolation
cognee_dataset_prefix: "a0"

# Explicit dataset ID override (leave empty for auto-derivation)
cognee_dataset_id: ""

# Enable/disable individual features
cognee_retain_enabled: true
cognee_recall_enabled: true
cognee_context_enabled: true

# Search configuration
cognee_search_type: "GRAPH_COMPLETION"
cognee_recall_max_tokens: 4096

# Auto-cognify after retaining new data (builds knowledge graph)
cognee_auto_cognify: true

# Context injection cache TTL in seconds
cognee_cache_ttl: 120

# Maximum tokens for context injection into system prompt
cognee_context_max_tokens: 500

# Debug logging
cognee_debug: false

# ─── Verbose Feedback Mode ──────────────────────────────────
#
# When enabled, Cognee extensions emit structured feedback events
# for init/recall/retain/context operations, similar to how the
# built-in FAISS memory exposes "Memories on the topic" and
# "Solutions from the past" sections. Disabled by default to keep
# normal conversations clean.

# Master switch for verbose mode
cognee_verbose: false

# Per-field controls for verbose events
cognee_verbose_include_dataset: true
cognee_verbose_include_recall_count: true
cognee_verbose_include_retain_status: true
cognee_verbose_include_prompt_injection_status: true

# Output channels for verbose events
cognee_verbose_emit_to_prompt: true
cognee_verbose_emit_to_log: true
